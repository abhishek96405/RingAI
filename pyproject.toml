# Duuutah AI — Test configuration.
# Production code is configured elsewhere; this file is test-scoped on purpose.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["backend/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--showlocals",
    "-p", "no:cacheprovider",
    "--timeout=30",
    "--import-mode=importlib",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=html:test_reports/coverage_html",
    "--cov-report=xml:test_reports/coverage.xml",
]
markers = [
    "unit: fast, no I/O",
    "integration: requires in-process app + mongomock + mocked externals",
    "webhook: webhook payload + signature tests",
    "security: tenant isolation, auth, rate-limiting, input validation",
    "voice: pipecat pipeline tests with mocked frames",
    "e2e_in_process: full in-process flows with mocked externals",
    "live: hits real external APIs — skipped by default",
    "slow: takes > 1 second",
]
env = [
    "ENVIRONMENT=test",
    "MONGO_URL=mongodb://localhost:27017",
    "DB_NAME=duuutah_test",
    "ENCRYPTION_SECRET_KEY=test_only_do_not_use_in_prod_32_chars_xxxxxx",
    "STRIPE_SECRET_KEY=sk_test_fake",
    "STRIPE_WEBHOOK_SECRET=whsec_test_fake",
    "STRIPE_CLIENT_ID=ca_test_fake",
    "TELNYX_API_KEY=KEY_test_fake",
    "TELNYX_CONNECTION_ID=test_conn",
    "TELNYX_PHONE_NUMBER=+15555550100",
    "CLERK_PUBLISHABLE_KEY=pk_test_fake",
    "CLERK_SECRET_KEY=sk_test_fake",
    "GOOGLE_GENAI_API_KEY=fake-genai-key",
    "GOOGLE_API_KEY=fake-google-key",
    "GOOGLE_CLIENT_ID=fake-client-id",
    "GOOGLE_CLIENT_SECRET=fake-client-secret",
    "GOOGLE_CALENDAR_REDIRECT_URI=http://localhost:8000/api/calendar/google/callback",
    "GOOGLE_MAPS_API_KEY=fake-maps-key",
    "SQUARE_APPLICATION_ID=fake-square-app",
    "SQUARE_ENVIRONMENT=sandbox",
    "SQUARE_REDIRECT_URI=http://localhost:8000/api/integrations/square/callback",
    "CLOVER_API_TOKEN=fake-clover-token",
    "CLOVER_ENV=sandbox",
    "CLOVER_MERCHANT_ID=fake-merchant",
    "CLOVER_APP_ID=fake-clover-app",
    "CLOVER_APP_SECRET=fake-clover-secret",
    "CLOVER_REDIRECT_URI=https://testserver/integrations/clover/callback",
    "CORS_ORIGINS=http://localhost:3000",
    "FRONTEND_URL=http://localhost:3000",
    "BACKEND_PUBLIC_URL=http://localhost:8000",
    "ENABLE_DEMO_MODE=false",
    "SEED_DEMO_DATA=false",
    # Clear any host-environment leakage of CF_SECRET_TOKEN so the
    # cloudflare_security_middleware (server.py:5399) is a no-op for tests.
    # See tests/FINDINGS.md "CF_SECRET_TOKEN env-var leakage".
    "CF_SECRET_TOKEN=",
    # Deterministic admin id so admin-only routes (e.g. /api/admin/cost-analytics)
    # accept the "admin" mock_clerk token without per-test env mutation.
    "ADMIN_USER_ID=user_admin",
    # Stripe price IDs — set so /api/billing/create-checkout-session has a price ref.
    "STRIPE_PRICE_STARTER=price_starter_test",
    "STRIPE_PRICE_PRO=price_pro_test",
    "STRIPE_CLIENT_ID=ca_test_fake",
    "PAYMENT_SUCCESS_URL=http://localhost:3000/payment-success",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:passlib.*",
    # A dependency (Starlette/jose, via the auth + middleware path) still calls the
    # deprecated datetime.datetime.utcnow(). The warning originates in code we don't
    # control — no source or test module in this repo calls utcnow(). With "error"
    # above, it gets promoted to a failure for whichever tests happen to hit that path
    # under pytest-randomly's ordering, producing a rotating set of ~17 flaky failures.
    # Ignoring it globally (the exact pattern 7 tests already apply locally) makes the
    # suite deterministic.
    "ignore:datetime.datetime.utcnow",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/temp_*.py",
    "backend/debug_*.py",
    "backend/seed_*.py",
    "backend/runtime.txt",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
precision = 1

[tool.coverage.html]
directory = "test_reports/coverage_html"
